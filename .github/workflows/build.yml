name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

# The compiled plugin is pushed to the "builds" branch, so the workflow needs write access.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    # Pinned: "ubuntu-latest" is migrating to a new image. 24.04 ships JDK 17 and the Android SDK.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Create the builds branch if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$REMOTE" builds > /dev/null 2>&1; then
            mkdir /tmp/init-builds
            cd /tmp/init-builds
            git init -q -b builds
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git commit -q --allow-empty -m "Initial builds branch"
            git push "$REMOTE" builds
          fi

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: |
          rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Plugins
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace 2>&1 | tee $GITHUB_WORKSPACE/build-log.txt
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      # Debug aid: publishes the Gradle output to the "build-logs" branch (GitHub's own log
      # download is not reachable from every environment). Safe to delete once builds are stable.
      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs
          {
            echo "== os"; head -3 /etc/os-release
            echo "== java"; java -version 2>&1
            echo "== android"; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" 2>&1 | head -20
            echo "== platforms"; ls "$ANDROID_HOME/platforms" 2>&1 | head -20
          } > env.txt 2>&1
          cp "$GITHUB_WORKSPACE/build-log.txt" . 2>/dev/null || true
          git init -q -b build-logs
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -q -m "Build log for $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs
